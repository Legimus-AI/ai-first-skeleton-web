name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Component repo depends on @repo/shared (workspace).
      # Neither pnpm nor npm can install with workspace:* deps, so download Biome directly.
      - name: Install Biome
        env:
          BIOME_VERSION: "2.4.7"
        run: |
          curl -sSfL "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%40${BIOME_VERSION}/biome-linux-x64" -o biome
          chmod +x biome

      - name: Lint
        run: ./biome check src

  architecture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # architecture.test.ts is pure node:fs + regex (no @repo/shared, no React,
      # no jsdom), so it runs standalone via npx WITHOUT the workspace install the
      # other tests need. It is the sole guardian of the CORE-vs-PATTERN:CRUD
      # layering (ADR 0014) and the archetype↔shell gate — it MUST run on every PR.
      - name: Architecture rules
        run: npx -y vitest@3.2.4 run --config vitest.config.arch.ts

  # ─── Why the OTHER tests are not run here ─────────────────────────────
  # The component/hook tests (React, @testing-library, jsdom) and the
  # use-todos test import @repo/shared / @/services, which need a full
  # node_modules install — impossible standalone with workspace:* deps.
  # Those run in the MONOREPO CI:
  #   - dev branch  → vitest --changed origin/dev --run --passWithNoTests
  #   - main branch → vitest run --coverage --passWithNoTests (full suite)
  # Only the dependency-free architecture test runs in this repo's own CI.
  # ──────────────────────────────────────────────────────────────────────
