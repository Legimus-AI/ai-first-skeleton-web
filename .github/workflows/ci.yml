name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Component repo depends on @repo/shared (workspace).
      # Neither pnpm nor npm can install with workspace:* deps, so download Biome directly.
      - name: Install Biome
        env:
          BIOME_VERSION: "2.6.3"
          # SHA-256 of biome-linux-x64 for BIOME_VERSION: bump both together.
          BIOME_SHA256: "1e5134625f00231035bfb14c12141cdc8fcab69b8275f354287808bb5d86d3ae"
        run: |
          curl -sSfL "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%40${BIOME_VERSION}/biome-linux-x64" -o biome
          echo "${BIOME_SHA256}  biome" | sha256sum -c -
          chmod +x biome

      - name: Lint
        run: ./biome check src

  architecture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # architecture.test.ts is pure node:fs + regex (no @repo/shared, no React,
      # no jsdom) — the sole guardian of the CORE-vs-PATTERN:CRUD layering (ADR 0014)
      # and the archetype↔shell gate, so it MUST run on every PR. The repo's own
      # package.json has workspace:* deps that block any install, so we temp-swap it
      # for a throwaway one, install ONLY vitest, restore, then run (same reason the
      # lint job downloads Biome as a standalone binary).
      - name: Architecture rules
        run: |
          mv package.json .package.json.bak
          npm init -y >/dev/null 2>&1
          # WHY: npm ignores pnpm's minimumReleaseAge, so --before keeps vitest's transitive deps at least 7 days old too.
          npm install --no-audit --no-fund --ignore-scripts --before="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" vitest@5.0.5 >/dev/null 2>&1
          mv -f .package.json.bak package.json
          npx vitest run --config vitest.config.arch.ts

  # ─── Why the OTHER tests are not run here ─────────────────────────────
  # The component/hook tests (React, @testing-library, jsdom) and the
  # use-todos test import @repo/shared / @/services, which need a full
  # node_modules install — impossible standalone with workspace:* deps.
  # Those run in the MONOREPO CI:
  #   - dev branch  → vitest --changed origin/dev --run --passWithNoTests
  #   - main branch → vitest run --coverage --passWithNoTests (full suite)
  # Only the dependency-free architecture test runs in this repo's own CI.
  # ──────────────────────────────────────────────────────────────────────
